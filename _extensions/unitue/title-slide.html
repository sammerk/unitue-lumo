<section id="title-slide" class="center" data-state="ut-on-title"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
  <div class="columns ut-ts">
    $if(title-image)$
    <div class="column ut-ts-picture">
      <img class="picture" src="$title-image$" alt="$if(title-image-alt)$$title-image-alt$$else$Titelbild$endif$" />
    </div>
    $endif$
    <div class="column ut-ts-text">
      $if(title)$<h2 class="title">$title$</h2>$endif$
      $if(subtitle)$<p class="subtitle">$subtitle$</p>$endif$
      $if(by-author)$<p class="author">$for(by-author)$$it.name.literal$$sep$ &amp; $endfor$</p>$endif$
      $if(date)$<p class="date">$date$</p>$endif$
      $if(institute)$<p class="institute">$if(faculty)$$faculty$ · $endif$$institute$</p>$endif$
    </div>
  </div>
</section>
