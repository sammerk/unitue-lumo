title: unitue
author: Samuel Merk
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    html:
      lang: de
      toc: true
      toc-location: left
      toc-title: " "
      code-fold: true
      code-summary: "Code"
